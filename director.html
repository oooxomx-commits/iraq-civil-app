<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة المدير - التجمع المدني العراقي</title>
  <meta name="theme-color" content="#1e3a8a">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Noto Sans Arabic', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-16">

  <!-- شاشة قفل المدير برمز سري -->
  <div id="pinScreen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-xs w-full p-6 text-center space-y-4 shadow-2xl">
      <div class="w-16 h-16 bg-blue-100 text-blue-900 rounded-full flex items-center justify-center text-3xl mx-auto">🔐</div>
      <div>
        <h2 class="font-bold text-slate-800 text-base">دخول المدير المصرح</h2>
        <p class="text-xs text-slate-500 mt-1">الرمز الافتراضي: 1234</p>
      </div>
      <input type="password" id="pinInput" maxlength="6" placeholder="أدخل الرمز السري" class="w-full text-center tracking-widest text-lg font-bold border-2 border-slate-300 rounded-xl p-2.5 outline-none focus:border-blue-700" dir="ltr">
      <button onclick="checkPin()" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-2.5 rounded-xl text-xs transition">فتح لوحة التحكم</button>
      <a href="index.html" class="block text-xs text-slate-400 hover:text-slate-600">العودة لبرنامج الضيوف</a>
    </div>
  </div>

  <!-- رأس لوحة المدير -->
  <header class="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-40">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-blue-900 font-bold text-xl shadow">🏛️</div>
        <div>
          <h1 class="font-bold text-base leading-tight">لوحة تحكم المدير</h1>
          <p class="text-xs text-blue-200">إدارة طلبات المواطنين والمقابلات</p>
        </div>
      </div>
      <a href="index.html" class="text-xs bg-blue-950 border border-blue-400/30 text-blue-200 px-3 py-1.5 rounded-lg hover:bg-blue-800 transition">بوابة الضيوف ↗</a>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 mt-4 space-y-4">
    <!-- إحصائيات سريعة -->
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 text-center">
        <span class="text-xs text-slate-500 block">الإجمالي</span>
        <span id="statTotal" class="text-lg font-bold text-blue-900">0</span>
      </div>
      <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 text-center">
        <span class="text-xs text-slate-500 block">قيد المراجعة</span>
        <span id="statPending" class="text-lg font-bold text-amber-600">0</span>
      </div>
      <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 text-center">
        <span class="text-xs text-slate-500 block">تمت الموافقة</span>
        <span id="statApproved" class="text-lg font-bold text-emerald-600">0</span>
      </div>
    </div>

    <!-- تصفية وبحث -->
    <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex gap-2">
      <input type="text" id="adminSearch" oninput="renderRequests()" placeholder="بحث بالاسم أو الهاتف أو الدائرة..." class="flex-1 border rounded-xl p-2 text-xs outline-none focus:ring-2 focus:ring-blue-700">
      <button onclick="clearAllData()" class="text-xs text-rose-500 px-2 hover:bg-rose-50 rounded-lg" title="تفريغ تجريبي">مسح</button>
    </div>

    <!-- قائمة الطلبات الواردة -->
    <div class="space-y-3" id="requestsContainer">
      <div class="bg-white p-6 rounded-2xl shadow-sm border text-center text-slate-400 text-xs">
        جاري جلب الطلبات...
      </div>
    </div>
  </main>

  <!-- نافذة تعديل الرد وتحديد الموعد -->
  <div id="actionModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-sm w-full p-5 space-y-3 shadow-2xl">
      <h3 class="font-bold text-slate-800 text-sm">تحديث حالة الطلب وتحديد موعد</h3>
      <input type="hidden" id="activeReqId">

      <div>
        <label class="block text-xs font-semibold mb-1">تغيير الحالة:</label>
        <select id="updateStatusSelect" class="w-full border rounded-xl p-2 text-xs outline-none bg-white">
          <option value="مقبول ومحدد موعد">مقبول ومحدد موعد</option>
          <option value="قيد المراجعة">قيد المراجعة</option>
          <option value="اعتذار">اعتذار</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1">الرد / تفاصيل الموعد:</label>
        <textarea id="updateResponseText" rows="3" class="w-full border rounded-xl p-2 text-xs outline-none focus:ring-2 focus:ring-blue-700" placeholder="مثال: تم قبول طلبك، يرجى الحضور يوم الخميس الساعة 10 صباحاً إلى مقر التجمع..."></textarea>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="saveReqUpdate()" class="flex-1 bg-blue-800 text-white py-2 rounded-xl text-xs font-bold hover:bg-blue-900 transition">حفظ وإرسال</button>
        <button onclick="closeActionModal()" class="px-4 py-2 border rounded-xl text-xs text-slate-600">إلغاء</button>
      </div>
    </div>
  </div>

  <script>
    const CORRECT_PIN = "1234";

    function checkPin() {
      const pin = document.getElementById('pinInput').value;
      if(pin === CORRECT_PIN) {
        document.getElementById('pinScreen').classList.add('hidden');
        renderRequests();
      } else {
        alert("الرمز السري غير صحيح!");
      }
    }

    function renderRequests() {
      const list = JSON.parse(localStorage.getItem('iraq_civil_requests') || '[]');
      const container = document.getElementById('requestsContainer');
      const search = (document.getElementById('adminSearch').value || '').trim().toLowerCase();

      let filtered = list.filter(r => 
        r.fullName.toLowerCase().includes(search) || 
        r.phone.includes(search) || 
        r.department.toLowerCase().includes(search) ||
        r.id.toLowerCase().includes(search)
      );

      // تحديث الإحصائيات
      document.getElementById('statTotal').innerText = list.length;
      document.getElementById('statPending').innerText = list.filter(r => r.status.includes('قيد المراجعة')).length;
      document.getElementById('statApproved').innerText = list.filter(r => r.status.includes('مقبول')).length;

      if(filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-2xl shadow-sm border text-center text-slate-400 text-xs">
            لا توجد طلبات واردة حالياً.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        let badgeColor = item.status.includes('مقبول') ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : (item.status.includes('اعتذار') ? 'bg-rose-100 text-rose-800 border-rose-300' : 'bg-amber-100 text-amber-800 border-amber-300');
        let cleanPhone = item.phone.startsWith('0') ? '964' + item.phone.substring(1) : item.phone;
        let whatsappUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent('السلام عليكم ' + item.fullName + '، بخصوص طلبك في التجمع المدني العراقي: ' + item.responseNote)}`;

        return `
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-2">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-bold text-slate-800 text-sm">${item.fullName}</h3>
                <span class="text-xs text-blue-700 font-medium">${item.type}</span> • <span class="text-xs text-slate-500">${item.department}</span>
              </div>
              <span class="px-2 py-0.5 text-xs rounded-full border font-bold ${badgeColor}">${item.status}</span>
            </div>

            <div class="grid grid-cols-2 gap-1 text-xs text-slate-600 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
              <p><strong>الهاتف:</strong> <span dir="ltr">${item.phone}</span></p>
              <p><strong>البطاقة الوطنية:</strong> ${item.nationalId}</p>
              <p><strong>المحافظة:</strong> ${item.birthPlace}</p>
              <p><strong>المواليد:</strong> ${item.birthDate}</p>
              <p class="col-span-2"><strong>السكن:</strong> ${item.address}</p>
              ${item.notes ? `<p class="col-span-2 text-slate-500 italic"><strong>ملاحظات:</strong> ${item.notes}</p>` : ''}
            </div>

            <div class="p-2 bg-blue-50/70 border border-blue-100 rounded-xl text-xs text-blue-900">
              <strong>رد الإدارة الحالي:</strong> ${item.responseNote}
            </div>

            <div class="flex items-center gap-2 pt-1">
              <button onclick="openActionModal('${item.id}', '${item.status}', '${item.responseNote.replace(/'/g, "\\'")}')" class="flex-1 bg-slate-800 text-white py-2 rounded-xl text-xs font-semibold hover:bg-slate-900 transition">
                ✏️ تعديل الرد والموعد
              </button>
              <a href="${whatsappUrl}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1 transition">
                <span>واتساب</span> 💬
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function openActionModal(id, status, note) {
      document.getElementById('activeReqId').value = id;
      document.getElementById('updateStatusSelect').value = status.includes('مقبول') ? 'مقبول ومحدد موعد' : (status.includes('اعتذار') ? 'اعتذار' : 'قيد المراجعة');
      document.getElementById('updateResponseText').value = note;
      document.getElementById('actionModal').classList.remove('hidden');
    }

    function closeActionModal() {
      document.getElementById('actionModal').classList.add('hidden');
    }

    function saveReqUpdate() {
      const id = document.getElementById('activeReqId').value;
      const newStatus = document.getElementById('updateStatusSelect').value;
      const newNote = document.getElementById('updateResponseText').value.trim();

      let list = JSON.parse(localStorage.getItem('iraq_civil_requests') || '[]');
      let item = list.find(r => r.id === id);
      if(item) {
        item.status = newStatus;
        item.responseNote = newNote || 'تم تحديث حالة طلبك من قبل الإدارة.';
        localStorage.setItem('iraq_civil_requests', JSON.stringify(list));
      }
      closeActionModal();
      renderRequests();
    }

    function clearAllData() {
      if(confirm('هل تريد مسح جميع البيانات للتجربة؟')) {
        localStorage.removeItem('iraq_civil_requests');
        renderRequests();
      }
    }
  </script>
</body>
</html>
